schema_version = "1.4"
artifacts = [{source = "/logs/artifacts", exclude = ["*", "**/*"]}]

[task]
name = "sciresearch-lite/heat"
description = "v0.3 heat research task; requires trusted research controller and custom verifier"
authors = []
keywords = ["scientific-computing", "research"]

[agent]
timeout_sec = 1800.0
user = "researcher"
network_mode = "allowlist"
allowed_hosts = ["api.deepseek.com"]

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 4
memory_mb = 4096
storage_mb = 1024
workdir = "/workspace"
mcp_servers = []

[verifier]
environment_mode = "separate"
timeout_sec = 1200.0
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
docker_image = "sciresearch-numeric:0.3.0"
cpus = 1
memory_mb = 4096
workdir = "/tmp"
